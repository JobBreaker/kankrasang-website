<style>
  :root {
    --navy: #0d2c51;
    --navy-deep: #081d38;
    --navy-darker: #051426;
    --gold: #cda075;
    --gold-soft: #d9b58f;
    --text-dim: #8fa3bb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    background: radial-gradient(ellipse 120% 90% at 50% 0%, var(--navy) 0%, var(--navy-deep) 55%, var(--navy-darker) 100%);
    color: #eef2f7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 24px;
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    max-width: 720px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: min(440px, 78vw);
    height: auto;
    display: block;
    margin-bottom: 44px;
    filter: drop-shadow(0 6px 30px rgba(0,0,0,0.35));
    animation: rise 1.2s ease-out both;
  }
  .rule {
    width: 72px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 36px;
    animation: rise 1.2s ease-out 0.15s both;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(30px, 5.4vw, 46px);
    letter-spacing: 0.04em;
    color: var(--gold-soft);
    margin-bottom: 18px;
    animation: rise 1.2s ease-out 0.25s both;
  }
  .sub {
    font-weight: 300;
    font-size: clamp(13px, 2.4vw, 15.5px);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 54px;
    animation: rise 1.2s ease-out 0.35s both;
  }
  .contact {
    animation: rise 1.2s ease-out 0.45s both;
  }
  .contact-label {
    font-size: 11.5px;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }
  .contact a {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(20px, 3.6vw, 26px);
    letter-spacing: 0.06em;
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid rgba(205,160,117,0.35);
    padding-bottom: 3px;
    transition: color .3s, border-color .3s;
  }
  .contact a:hover { color: var(--gold-soft); border-color: var(--gold-soft); }
  footer {
    margin-top: 72px;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(143,163,187,0.55);
    animation: rise 1.2s ease-out 0.55s both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .rule, h1, .sub, .contact, footer { animation: none; }
  }
</style>
